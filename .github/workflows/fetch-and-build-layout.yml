name: Fetch and build layout

on:
  workflow_dispatch:
    inputs:
      oryx_revision:
        description: "Oryx revision (latest, or a revision ID to rebuild)"
        required: true
        default: "latest"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "scripts/**"
      - "tests/**"
      - "layout.json"
      - "Dockerfile"
      - ".github/workflows/fetch-and-build-layout.yml"
  pull_request:
    paths:
      - "modules/**"
      - "scripts/**"
      - "tests/**"
      - "layout.json"
      - "Dockerfile"
      - ".github/workflows/fetch-and-build-layout.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check layout preparation and SOCD behavior
        run: |
          python3 -m unittest discover -s tests -v
          mkdir -p .build
          cc -std=c11 -Wall -Wextra -Werror -Itests/stubs -Imodules/getreuer/socd_cleaner tests/test_socd.c -o .build/test_socd
          .build/test_socd

      - name: Download Oryx and apply customizations
        id: layout
        env:
          ORYX_REVISION: ${{ inputs.oryx_revision || 'latest' }}
        run: |
          python3 scripts/prepare_layout.py --revision "$ORYX_REVISION"
          echo "firmware_ref=$(jq -r .firmware_ref .build/build-info.json)" >> "$GITHUB_OUTPUT"
          echo "keyboard=$(jq -r .keyboard layout.json)" >> "$GITHUB_OUTPUT"
          echo "layout_id=$(jq -r .layout_id layout.json)" >> "$GITHUB_OUTPUT"

      - name: Download official ZSA firmware and install the local module
        env:
          FIRMWARE_REF: ${{ steps.layout.outputs.firmware_ref }}
          KEYBOARD: ${{ steps.layout.outputs.keyboard }}
          LAYOUT_ID: ${{ steps.layout.outputs.layout_id }}
        run: |
          git clone --depth=1 --branch "$FIRMWARE_REF" --recurse-submodules --shallow-submodules https://github.com/zsa/qmk_firmware.git .build/qmk
          mkdir -p .build/qmk/modules/getreuer
          cp -r modules/getreuer/socd_cleaner .build/qmk/modules/getreuer/
          mkdir -p ".build/qmk/keyboards/zsa/$KEYBOARD/keymaps/$LAYOUT_ID"
          cp -r .build/layout/. ".build/qmk/keyboards/zsa/$KEYBOARD/keymaps/$LAYOUT_ID/"
          git -C .build/qmk rev-parse HEAD > .build/qmk-commit.txt

      - name: Build QMK environment
        run: docker build -t moonlander-qmk .

      - name: Compile firmware
        env:
          KEYBOARD: ${{ steps.layout.outputs.keyboard }}
          LAYOUT_ID: ${{ steps.layout.outputs.layout_id }}
        run: |
          docker run --rm -v "$PWD/.build/qmk:/root" moonlander-qmk qmk compile -kb "zsa/$KEYBOARD" -km "$LAYOUT_ID"
          mkdir -p .build/firmware
          cp .build/qmk/*.bin .build/firmware/
          cp -r modules .build/modules
          cp layout.json .build/layout-settings.json

      - name: Upload firmware and matching sources
        uses: actions/upload-artifact@v7
        with:
          name: moonlander-${{ steps.layout.outputs.layout_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .build/firmware/*.bin
            .build/layout/
            .build/oryx-source/
            .build/modules/
            .build/layout-settings.json
            .build/build-info.json
            .build/qmk-commit.txt
